[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugscanner"
version = "2.1.0"
description = "An advanced, context-aware recon & automated web vulnerability assessment framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Eldar Shiraliyev", email = "eldar@example.com"},
]
keywords = ["bugbounty", "pentest", "security", "vulnerability-scanner", "recon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "httpx[http2]>=0.27.0",
    "click>=8.1.7",
    "rich>=13.7.1",
    "pydantic>=2.6.4",
    "PyYAML>=6.0.1",
    "aiofiles>=23.2.1",
    "tldextract>=5.1.2",
    "dnspython>=2.6.1",
    "beautifulsoup4>=4.12.3",
    "jinja2>=3.1.3",
    "MarkupSafe>=2.1.5",
    "PyJWT>=2.8.0",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
]

[project.scripts]
bugscanner = "cli:cli"

[project.urls]
Homepage = "https://github.com/eldarshiraliyev/BugScanner"
Repository = "https://github.com/eldarshiraliyev/BugScanner"
Issues = "https://github.com/eldarshiraliyev/BugScanner/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["core", "modules"]
omit = ["*/tests/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]